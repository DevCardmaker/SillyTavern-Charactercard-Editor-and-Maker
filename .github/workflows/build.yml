# Builds the Linux (AppImage + rpm) and Windows (NSIS installer) bundles on GitHub's runners.
#
# - Pushing a tag `vX.Y.Z` creates a *draft* release with the CHANGELOG section for X.Y.Z as its
#   notes and all bundles attached. Nothing is public until the draft is published by hand.
# - Pushing the `test-build` branch (or running the workflow manually) only builds; the bundles
#   are attached to the workflow run as downloadable artifacts.
name: Build

on:
  push:
    tags: ["v*"]
    branches: ["test-build"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            // The CHANGELOG section for this version: from its "## [X.Y.Z]" heading up to the next one.
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.findIndex((l) => l.startsWith(`## [${version}]`));
            if (start === -1) {
              core.setFailed(`CHANGELOG.md has no section for ${version}`);
              return;
            }
            const rest = lines.slice(start + 1);
            // Ends at the next version heading or the "[X.Y.Z]: https://…" link definitions at the bottom.
            const end = rest.findIndex((l) => l.startsWith("## [") || /^\[[^\]]+\]: /.test(l));
            const body = rest.slice(0, end === -1 ? undefined : end).join("\n").trim();
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body,
              draft: true,
            });
            core.setOutput("id", data.id);

  build:
    needs: create-release
    # Also runs when create-release was skipped (test builds without a tag).
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,rpm
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "1"
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Attach bundles to the workflow run (test builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
